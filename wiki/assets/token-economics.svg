<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="te-title te-desc">
  <title id="te-title">Cymatix Context token economics</title>
  <desc id="te-desc">Horizontal bar chart comparing input tokens per turn. Standard RAG baseline is 8,000 tokens (top-5 chunks of 1,500 tokens plus 500 overhead). Cymatix delivers 3,755 tokens on its worst query shape (2.1 times fewer), 2,757 at the median (2.9 times fewer), and 1,410 on its best focused query (5.7 times fewer). N=15 query shapes, May 2026.</desc>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

    <!-- header -->
    <text x="40" y="34" font-size="16.5" font-weight="600" fill="#6e7681">Token economics &#8212; input tokens per turn</text>
    <text x="40" y="56" font-size="12" fill="#8b949e">Measured with the compressor disabled, i.e. the default LLM-free configuration.</text>

    <!-- reference edge -->
    <line x1="700" y1="100" x2="700" y2="292" stroke="#7d8590" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 4"/>

    <!-- baseline row -->
    <rect x="250" y="108" width="450" height="26" rx="4" fill="#888888" fill-opacity="0.27" stroke="#7d8590" stroke-width="1.5"/>
    <text x="234" y="118" font-size="12" fill="#7d8590" text-anchor="end">standard RAG baseline</text>
    <text x="234" y="133" font-size="11" fill="#8b949e" text-anchor="end">top-5 &#215; 1,500 + 500 overhead</text>
    <text x="712" y="125" font-size="12" fill="#7d8590">8,000 tokens</text>

    <!-- worst -->
    <rect x="250" y="156" width="211" height="26" rx="4" fill="#e8883a" fill-opacity="0.28" stroke="#c76a1c" stroke-width="1.5"/>
    <text x="234" y="173" font-size="12" fill="#7d8590" text-anchor="end">worst &#8212; broad 12-doc</text>
    <text x="473" y="173" font-size="12" fill="#8b949e">3,755 tokens &#8212; <tspan font-weight="600" fill="#c76a1c">2.1&#215;</tspan> fewer</text>

    <!-- median -->
    <rect x="250" y="204" width="155" height="26" rx="4" fill="#e8883a" fill-opacity="0.48" stroke="#c76a1c" stroke-width="2"/>
    <text x="234" y="221" font-size="12" font-weight="600" fill="#6e7681" text-anchor="end">median</text>
    <text x="417" y="221" font-size="12" fill="#8b949e">2,757 tokens &#8212; <tspan font-weight="600" fill="#c76a1c">2.9&#215;</tspan> fewer</text>

    <!-- best -->
    <rect x="250" y="252" width="79" height="26" rx="4" fill="#e8883a" fill-opacity="0.28" stroke="#c76a1c" stroke-width="1.5"/>
    <text x="234" y="269" font-size="12" fill="#7d8590" text-anchor="end">best &#8212; focused query</text>
    <text x="341" y="269" font-size="12" fill="#8b949e">1,410 tokens &#8212; <tspan font-weight="600" fill="#c76a1c">5.7&#215;</tspan> fewer</text>

    <!-- axis -->
    <g stroke="#7d8590" stroke-width="1" stroke-opacity="0.6">
      <line x1="250" y1="296" x2="700" y2="296"/>
      <line x1="250"   y1="296" x2="250"   y2="301"/>
      <line x1="362.5" y1="296" x2="362.5" y2="301"/>
      <line x1="475"   y1="296" x2="475"   y2="301"/>
      <line x1="587.5" y1="296" x2="587.5" y2="301"/>
      <line x1="700"   y1="296" x2="700"   y2="301"/>
    </g>
    <g font-size="10.5" fill="#8b949e" text-anchor="middle">
      <text x="250"   y="315">0</text>
      <text x="362.5" y="315">2k</text>
      <text x="475"   y="315">4k</text>
      <text x="587.5" y="315">6k</text>
      <text x="700"   y="315">8k</text>
      <text x="475"   y="336">input tokens delivered per turn</text>
    </g>

    <!-- caption -->
    <g font-size="11" fill="#8b949e">
      <text x="40" y="372">N=15 query shapes, May 2026 &#8212; baseline is configurable (top-5 &#215; 1500 tokens)</text>
      <text x="40" y="390">Reproducer: benchmarks/bench_rag_vs_sike_tokens.py &#183; RAG_TOP_K, RAG_CHUNK_TOKENS and RAG_OVERHEAD are env-tunable.</text>
    </g>

  </g>
</svg>
