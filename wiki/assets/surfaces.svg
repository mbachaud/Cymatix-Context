<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 456" width="860" height="456" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">Cymatix Context surfaces</title>
  <desc id="sf-desc">Four client surfaces (CLI, MCP, OpenAI-compatible proxy, raw HTTP) feed one pipeline, which reads and writes a single SQLite knowledge store. An optional telemetry side-tap exports OpenTelemetry data to a Grafana stack.</desc>

  <defs>
    <marker id="sf-ar" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0.6 L8.5,4.5 L0,8.4 Z" fill="#7d8590"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

    <!-- header -->
    <text x="40" y="34" font-size="16.5" font-weight="600" fill="#6e7681">Cymatix Context &#8212; surfaces</text>
    <text x="40" y="56" font-size="12" fill="#8b949e">Four ways in, one pipeline, one knowledge store on disk.</text>

    <!-- column captions -->
    <g font-size="10.5" font-weight="600" fill="#8b949e" letter-spacing="0.6">
      <text x="40"  y="82">CLIENT SURFACES</text>
      <text x="360" y="82">ENGINE</text>
      <text x="600" y="82">STORAGE</text>
    </g>

    <!-- client boxes -->
    <g fill="#888888" fill-opacity="0.27" stroke="#7d8590" stroke-width="1.5">
      <rect x="40" y="96"  width="240" height="52" rx="8"/>
      <rect x="40" y="158" width="240" height="52" rx="8"/>
      <rect x="40" y="220" width="240" height="52" rx="8"/>
      <rect x="40" y="282" width="240" height="52" rx="8"/>
    </g>
    <g font-size="13.5" font-weight="600" fill="#6e7681">
      <text x="56" y="117">CLI</text>
      <text x="56" y="179">MCP</text>
      <text x="56" y="241">OpenAI-compatible proxy</text>
      <text x="56" y="303">Raw HTTP</text>
    </g>
    <g font-size="11" fill="#8b949e">
      <text x="56" y="134">cymatix query &#183; cymatix packet</text>
      <text x="56" y="196">mcp__cymatix__* tool surface</text>
      <text x="56" y="258">POST /v1/chat/completions</text>
      <text x="56" y="320">POST /context &#183; /context/packet</text>
    </g>

    <!-- bus from clients into the pipeline -->
    <g stroke="#7d8590" stroke-width="1.5" fill="none">
      <line x1="280" y1="122" x2="322" y2="122"/>
      <line x1="280" y1="184" x2="322" y2="184"/>
      <line x1="280" y1="246" x2="322" y2="246"/>
      <line x1="280" y1="308" x2="322" y2="308"/>
      <line x1="322" y1="122" x2="322" y2="308"/>
      <line x1="322" y1="215" x2="356" y2="215" marker-end="url(#sf-ar)"/>
    </g>

    <!-- pipeline box -->
    <rect x="360" y="140" width="190" height="150" rx="8" fill="#e8883a" fill-opacity="0.13" stroke="#c76a1c" stroke-width="2"/>
    <text x="376" y="166" font-size="13.5" font-weight="600" fill="#c76a1c">Cymatix pipeline</text>
    <g font-size="11" fill="#8b949e">
      <text x="376" y="190">0 Classify</text>
      <text x="376" y="204">1 Extract</text>
      <text x="376" y="218">2 Retrieve</text>
      <text x="376" y="232">3 Re-rank (optional)</text>
      <text x="376" y="246">4 Splice (optional)</text>
      <text x="376" y="260">5 Assemble + gate</text>
      <text x="376" y="274">6 Persist</text>
    </g>

    <!-- pipeline to store -->
    <line x1="550" y1="215" x2="596" y2="215" stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#sf-ar)"/>

    <!-- store box -->
    <rect x="600" y="160" width="220" height="110" rx="8" fill="#888888" fill-opacity="0.27" stroke="#7d8590" stroke-width="1.5"/>
    <text x="616" y="188" font-size="13.5" font-weight="600" fill="#6e7681">SQLite knowledge store</text>
    <g font-size="11" fill="#8b949e">
      <text x="616" y="210">a single .db file</text>
      <text x="616" y="228">FTS5 index &#183; documents &#183; tags</text>
      <text x="616" y="246">co-activation edges &#183; sessions</text>
    </g>

    <!-- telemetry side-tap -->
    <line x1="455" y1="290" x2="455" y2="341" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#sf-ar)"/>
    <text x="466" y="320" font-size="10.5" fill="#8b949e">side-tap</text>

    <g fill="#888888" fill-opacity="0.18" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4">
      <rect x="360" y="344" width="190" height="48" rx="8"/>
      <rect x="600" y="344" width="220" height="48" rx="8"/>
    </g>
    <g font-size="13.5" font-weight="600" fill="#6e7681">
      <text x="376" y="366">OpenTelemetry</text>
      <text x="616" y="366">Grafana stack</text>
    </g>
    <g font-size="11" fill="#8b949e">
      <text x="376" y="383">traces &#183; metrics &#183; logs</text>
      <text x="616" y="383">Prometheus &#183; Tempo &#183; Loki</text>
    </g>
    <line x1="550" y1="368" x2="596" y2="368" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#sf-ar)"/>

    <!-- footer -->
    <g font-size="11" fill="#8b949e">
      <text x="40" y="422">All four surfaces share one pipeline and one knowledge store &#8212; the CLI needs no server and no daemon.</text>
      <text x="40" y="440">The telemetry side-tap is optional; OTel export is off at shipped defaults (CYMATIX_OTEL_ENABLED=1 turns it on).</text>
    </g>

  </g>
</svg>
