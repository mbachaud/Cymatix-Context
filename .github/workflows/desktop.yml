name: desktop

# Desktop app: unit tests on every PR touching desktop/; the packaged build
# matrix only on a desktop-v* tag or a manual run. Signing steps are skipped
# until their secrets exist.

on:
  pull_request:
    paths:
      - "desktop/**"
      - "assets/brand/**"
      - ".github/workflows/desktop.yml"
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (no Electron needed)
        working-directory: desktop
        run: node --test "test/**/*.test.js"

  build:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-14          # arm64
            target: mac
            arch: arm64
          - os: macos-13          # x64
            target: mac
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'always' || 'never' }}
      # `secrets` is not allowed in step `if:`; expose presence as an env flag.
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Python engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[launcher]" pyinstaller
          python desktop/engine/build_engine.py
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization: electron-builder skips them when unset.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing inside electron-builder, so the
          # signed installer's checksum is the one electron-updater publishes.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ARGS: >-
            ${{ matrix.target == 'win' && env.HAS_AZURE_SIGNING == 'true' && format(
              '-c.win.azureSignOptions.publisherName="{0}" -c.win.azureSignOptions.endpoint={1} -c.win.azureSignOptions.codeSigningAccountName={2} -c.win.azureSignOptions.certificateProfileName={3}',
              secrets.AZURE_PUBLISHER_NAME, secrets.AZURE_SIGNING_ENDPOINT,
              secrets.AZURE_SIGNING_ACCOUNT, secrets.AZURE_CERT_PROFILE) || '' }}
        shell: bash
        run: npx electron-builder --config electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish ${{ env.PUBLISH }} $SIGN_ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: cymatix-desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: warn
