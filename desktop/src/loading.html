<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; img-src file:; style-src 'unsafe-inline'">
  <title>Cymatix</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #090c10; color: #c9beb0;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    body { display: grid; place-items: center; }
    .box { display: grid; justify-items: center; gap: 18px; text-align: center; padding: 16px; }
    img { width: 160px; height: 160px; border-radius: 22px; }
    p { margin: 0; font-size: 14px; }
    .err { color: #ff7a8a; max-width: 70ch; white-space: pre-wrap; text-align: left;
      font-family: Consolas, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <img id="splash" alt="" hidden>
    <p id="status">Starting Cymatix…</p>
    <p class="err" id="error"></p>
  </div>
  <script src="loading.js"></script>
</body>
</html>
